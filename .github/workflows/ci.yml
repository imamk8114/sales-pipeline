name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 requires Node ^22.22.2 || ^24.15.0 || >=26.0.0 (it relies
          # on undici/webidl APIs not present in Node 20's bundled version) —
          # 20 fails with "webidl.util.markAsUncloneable is not a function".
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
